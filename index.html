<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full-Screen Map With Animated Target Overlay</title>
  <!-- External stylesheet -->
  <link rel="stylesheet" href="style.css" />
  <!-- Mapbox GL JS stylesheet -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet" />
</head>
<body>
  <!-- Map container -->
  <div id="map"></div>
  
  <!-- Target overlay: animated red lines and central marker -->
  <div id="overlay">
    <div class="line horizontal left"></div>
    <div class="line horizontal right"></div>
    <div class="line vertical top"></div>
    <div class="line vertical bottom"></div>
    <div id="center-marker"></div>
  </div>
  
  <!-- Mapbox GL JS library -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
  <!-- Custom script for map initialization -->
  <script src="script.js"></script>
</body>
</html>
