<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Danger Map</title>
    
    <!-- Mapbox GL JS stylesheet -->
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css"
      rel="stylesheet"
    />
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Map container -->
    <div id="map"></div>

    <!-- Overlay container for animated red lines -->
    <div id="overlay">
      <!-- Cross lines (horizontal & vertical) -->
      <div class="line horizontal left"></div>
      <div class="line horizontal right"></div>
      <div class="line vertical top"></div>
      <div class="line vertical bottom"></div>
      <!-- Diagonal lines forming a triangle from screen edges to center -->
      <div class="line diagonal tl"></div>
      <div class="line diagonal tr"></div>
      <div class="line diagonal bm"></div>
    </div>

    <!-- Info container for status message and clock (positioned top-right) -->
    <div id="info">
      <div id="status">ESTABLISHING VIDEO UPLINK...</div>
      <div id="clock" style="display: none;"></div>
    </div>

    <!-- Mapbox GL JS library -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
    <!-- Link to external JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
