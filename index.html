<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>B&A Network Perimeter</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="network-canvas" role="graphics"></canvas>

  <script type="module">
    import { Network } from './js/network.js';

    const canvas = document.getElementById('network-canvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const net = new Network(canvas);

    function frameLoop() {
      net.updateAndDraw();
      requestAnimationFrame(frameLoop);
    }

    frameLoop();

    window.addEventListener('resize', () => {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      net.updateDimensions(canvas.width, canvas.height);
    });
  </script>
</body>
</html>
