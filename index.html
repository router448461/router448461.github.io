<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <!-- Clickjacking protection -->
  <meta http-equiv="X-Frame-Options" content="DENY">
  <!-- MIME sniffing protection -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <!-- Don’t send Referer header -->
  <meta name="referrer" content="no-referrer">
  <!-- Disable unused browser features -->
  <meta http-equiv="Permissions-Policy"
        content="geolocation=(); camera=(); microphone=(); interest-cohort=()">
  <!-- Strict CSP: only self‐hosted images & styles, no scripts -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'none';">

  <title>Strobe World Map</title>

  <!-- Preload map for fastest paint -->
  <link rel="preload" href="world-map.png" as="image">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Black map layer -->
  <img id="map-black" src="world-map.png" alt="World map">
  <!-- Inverted (white) map layer -->
  <img id="map-white" src="world-map.png" alt="">
  <!-- Centered strobing text -->
  <div id="strobe-text">FLASHING TEXT</div>

  <!-- Service Worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .catch(err => console.error('SW registration failed:', err));
    }
  </script>
</body>
</html>
