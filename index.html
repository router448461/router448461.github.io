<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>World on Fire</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1) Dark world map -->
  <div id="mapBG"></div>

  <!-- 2) Fiery overlay (slightly blurred) -->
  <div id="fireBG"></div>

  <!-- 3) Ember canvas -->
  <canvas id="embers"></canvas>

  <!-- 4) Scanlines/glitch -->
  <div id="scanlines"></div>

  <!-- 5) Scrolling quote -->
  <div id="ticker">
    <span class="message">
      The sun rises, sets in a day, but my love for you always remains. 
      You've had enough chances now; it's time. Now, at least, go and say goodbye.
    </span>
  </div>

  <!-- 6) Click ripple -->
  <div id="ripple"></div>

  <script src="script.js"></script>
</body>
</html>
