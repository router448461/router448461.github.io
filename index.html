<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Constellation — Tactical</title>

  <!-- Boot visuals -->
  <link rel="stylesheet" href="assets/css/loader.css" />

  <!-- main.css is preloaded/applied by engine.init.js -->
  <script src="assets/js/engine.init.js" defer></script>
</head>
<body>
  <div id="loader" aria-hidden="true">
    <div class="loader-wrap" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <div class="blink">Initializing Tactical Feed...</div>
    </div>
  </div>

  <!-- Single canvas — world is composited into canvas for an integrated, realistic overlay -->
  <canvas id="constellationCanvas" aria-hidden="false"></canvas>
</body>
</html>
