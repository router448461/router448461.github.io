<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DEMON SEED</title>
  <meta name="description" content="DEMON SEED — a cinematic, real-time canvas of drifting embers and dark constellations." />
  <meta name="theme-color" content="#0b0f16" />

  <!-- Minimal, instant boot visuals -->
  <link rel="stylesheet" href="assets/css/loader.css" />

  <!-- Orchestrator: sets namespace, loads modules, starts app -->
  <script src="assets/js/engine.init.js" defer></script>
</head>
<body>
  <div id="loader" aria-live="polite">
    <div class="loader-wrap">
      <div class="spinner" aria-hidden="true"></div>
      <div class="blink">Seeding...</div>
    </div>
  </div>

  <canvas id="constellationCanvas" aria-label="Cinematic particle field" aria-describedby="scene-desc"></canvas>
  <p id="scene-desc" class="sr-only">
    A dark field of ember-like particles drift and form dynamic constellations, rendered in real time.
  </p>

  <!-- Optional subtle overlay for added mood; non-interactive -->
  <div class="overlay-vignette" aria-hidden="true"></div>
</body>
</html>
