<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>router448461</title>
    <!-- Mapbox CSS -->
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css"
      rel="stylesheet"
    />
    <!-- Google Font for a digital look -->
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Map container (displayed as soon as it is loaded) -->
    <div id="map"></div>

    <!-- Overlay for the four cross lines -->
    <div id="overlay">
      <div class="line horizontal left"></div>
      <div class="line horizontal right"></div>
      <div class="line vertical top"></div>
      <div class="line vertical bottom"></div>
    </div>
    
    <!-- Digital stopwatch clock (top right) -->
    <div id="clock">00:00:000</div>
    
    <!-- Status messages (top left) -->
    <div id="status-container">
      <div id="status">TARGET LOCKED</div>
      <div id="extra-status">PROTOCOL INITIATED</div>
    </div>
    
    <!-- Radar sweep overlay (centered) -->
    <div id="radar"></div>
    
    <!-- Scanline overlay for a CRT/digital feel -->
    <div id="scanlines"></div>
    
    <!-- Audio elements (replace src with your own audio file paths) -->
    <audio id="audio-bg" src="your-background-audio.mp3" preload="auto"></audio>
    <audio id="audio-alert" src="your-alert-audio.mp3" preload="auto"></audio>
    
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
    <script src="script.js"></script>
  </body>
</html>
