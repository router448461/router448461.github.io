<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>World on Fire</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient audio -->
  <audio id="ambient" loop autoplay>
    <source src="ambient-rumble.mp3" type="audio/mpeg">
  </audio>
  <button id="mute-btn">🔇</button>

  <!-- Scrolling text -->
  <div id="ticker">
    <span class="message">
      The sun rises, sets in a day, but my love for you always remains. 
      You've had enough chances now; it's time. Now, at least, go and say goodbye.
    </span>
  </div>

  <!-- Fire background -->
  <video id="fire-bg" autoplay loop muted playsinline>
    <source src="fire-loop.mp4" type="video/mp4">
  </video>

  <!-- Ember canvas -->
  <canvas id="embers"></canvas>

  <script src="script.js"></script>
</body>
</html>
