<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>router448461 // net-scan</title>
  <meta
    name="description"
    content="Browser-exposed visitor telemetry terminal."
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <div class="topline">
      <span>router448461.com</span>
      <span id="status">BOOTING</span>
    </div>

    <div class="prompt">
visitor@router448461:~$ ./net-scan --live --browser --display --transport --capabilities
    </div>

    <pre id="terminal" aria-live="polite"></pre>

    <div class="prompt tail">
visitor@router448461:~$ <span class="cursor">█</span>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
