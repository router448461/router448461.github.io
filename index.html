<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Joshua’s Military Map</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-sA+e2BfMZjWrZv3NlmUZpGDjCQausn6I0sWv+X5oZVo="
    crossorigin=""
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="map"></div>

  <!-- CSS Overlays -->
  <div class="grid-overlay"></div>
  <div class="hud-reticle"></div>
  <div class="radar-sweep"></div>
  <div class="binary-code" id="binary"></div>
  <div class="coords-edge">
    Joshua 6:1<br/>
    31.8667 N, 35.4500 E
  </div>
  <div class="mission-text">
    MISSION: SECURE THE PROMISED LAND
  </div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-o9N1jZPIvtnNCg3xxegtTgHr/I3uE2MoS9NbbJ4YwMo="
    crossorigin=""
  ></script>

  <script src="js/script.js"></script>
</body>
</html>
