<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Constellation — Tactical</title>

  <!-- Boot visuals -->
  <link rel="stylesheet" href="assets/css/loader.css" />

  <!-- Inline polyfill for window.styleMedia to avoid deprecation noise from third-party code.
       This runs as early as possible (before engine.init.js) so other scripts won't trigger
       a styleMedia warning when they access window.styleMedia. -->
  <script>
    (function () {
      if (!window.styleMedia) {
        try {
          window.styleMedia = {
            matchMedium(q) {
              try {
                return !!window.matchMedia && window.matchMedia(q).matches;
              } catch (e) {
                return false;
              }
            }
          };
        } catch (e) { /* safe noop */ }
      }
    })();
  </script>

  <!-- main.css is injected by engine.init.js -->
  <script src="assets/js/engine.init.js" defer></script>
</head>
<body>
  <div id="loader" aria-hidden="true">
    <div class="loader-wrap" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <div class="blink">Initializing Tactical Feed...</div>
    </div>
  </div>

  <!-- Single canvas — world is composited into canvas for an integrated, realistic overlay -->
  <canvas id="constellationCanvas" aria-hidden="false"></canvas>
</body>
</html>
