<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>World on Fire</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1) Static world map (under) -->
  <img id="mapImage"
       src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/World_map_-_low_resolution.svg/2000px-World_map_-_low_resolution.svg.png"
       alt="World map">

  <!-- 2) Fire loop (over map) -->
  <img id="fireBG"
       src="https://media.giphy.com/media/3oEjI6SIIHBdRxXI40/giphy.gif"
       alt="Burning fire loop">

  <!-- 3) Embers drifting -->
  <canvas id="embers"></canvas>

  <!-- 4) Subtle scanline/glitch overlay -->
  <div id="scanlines"></div>

  <!-- 5) Scrolling quote ticker -->
  <div id="ticker">
    <span class="message">
      The sun rises, sets in a day, but my love for you always remains. 
      You've had enough chances now; it's time. Now, at least, go and say goodbye.
    </span>
  </div>

  <!-- 6) Click “burn ripple” -->
  <div id="ripple"></div>

  <script src="script.js"></script>
</body>
</html>
