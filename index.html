<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>World on Fire – Apocalypse UI</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body class="black">

  <!-- 3D globe -->
  <canvas id="globeCanvas"></canvas>

  <!-- AI “Matrix” data rain -->
  <canvas id="dataRain"></canvas>

  <!-- ember particles -->
  <canvas id="embers"></canvas>

  <!-- glitch / scanlines overlay -->
  <div id="scanlines"></div>

  <!-- scrolling mantra -->
  <div id="ticker">
    <span class="message">
      The sun rises, sets in a day, but my love for you always remains. 
      You've had enough chances now; it's time. Now, at least, go and say goodbye.
    </span>
  </div>

  <!-- ripple effect on click -->
  <div id="ripple"></div>

  <!-- three.js from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.156.0/build/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
