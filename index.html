<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Constellation</title>

  <!-- Minimal, instant boot visuals -->
  <link rel="stylesheet" href="assets/css/loader.css" />

  <!-- Option A (faster boot): main.css is preloaded and applied by engine.init.js -->
  <!-- Option B (simpler): uncomment the next line to load main.css immediately -->
  <!-- <link rel="stylesheet" href="assets/css/main.css" /> -->

  <!-- Orchestrator: sets namespace, loads modules, starts app -->
  <script src="assets/js/engine.init.js" defer></script>
</head>
<body>
  <div id="loader" aria-live="polite">
    <div class="loader-wrap">
      <div class="spinner" aria-hidden="true"></div>
      <div class="blink">connecting...</div>
    </div>
  </div>

  <canvas id="constellationCanvas"></canvas>
</body>
</html>
