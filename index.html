<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>World on Fire</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Dark, detailed vector map -->
  <div id="mapBG"></div>

  <!-- Fire overlay -->
  <div id="fireBG"></div>

  <!-- Embers -->
  <canvas id="embers"></canvas>

  <!-- Scanlines & glitch -->
  <div id="scanlines"></div>

  <!-- Scrolling quote -->
  <div id="ticker">
    <span class="message">
      The sun rises, sets in a day, but my love for you always remains. 
      You've had enough chances now; it's time. Now, at least, go and say goodbye.
    </span>
  </div>

  <!-- Burn ripple on click -->
  <div id="ripple"></div>

  <script src="script.js"></script>
</body>
</html>
