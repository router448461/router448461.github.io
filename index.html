<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blood & Ash Network</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="network-canvas" aria-label="Network visualization"></canvas>

  <script type="module">
    import { Network } from './js/network.js';

    const canvas = document.getElementById('network-canvas');
    const net = new Network(canvas);

    function resize() {
      net.resize(window.innerWidth, window.innerHeight, window.devicePixelRatio || 1);
    }

    function animate() {
      net.updateAndDraw();
      requestAnimationFrame(animate);
    }

    resize();
    animate();
    window.addEventListener('resize', resize);
  </script>
</body>
</html>
