<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tasmania Survival Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="map.css" />
</head>

<body>

  <h1>Tasmania Survival Field Map</h1>
  <p class="subtitle">
    A slow‑building assessment of Tasmania’s resilience: fuel, food, medicine, industry, history, and long‑horizon risk.
  </p>

  <div class="stream" id="stream"></div>

  <button id="next">Next</button>
  <button id="all">Reveal All</button>

  <!-- Tasmania Map Overlay -->
  <div id="tasmap">
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/5b/Tasmania_map_blank.svg" />
  </div>

  <!-- Global Risk Clock -->
  <div id="riskclock"></div>

  <!-- Scripts -->
  <script src="daily.js"></script>
  <script src="riskclock.js"></script>
  <script src="map.js"></script>
  <script src="main.js"></script>

</body>
</html>
