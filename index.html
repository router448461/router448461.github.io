<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sinister Map with Timer and Flash</title>
    <!-- External stylesheet -->
    <link rel="stylesheet" href="style.css" />
    <!-- Mapbox GL JS stylesheet -->
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Map container -->
    <div id="map"></div>

    <!-- Timer overlay (shows visitor’s local time) -->
    <div id="timer"></div>

    <!-- Overlay container for the animated red lines and drawn circle -->
    <div id="overlay">
      <!-- Animated red lines -->
      <div class="line horizontal left"></div>
      <div class="line horizontal right"></div>
      <div class="line vertical top"></div>
      <div class="line vertical bottom"></div>

      <!-- Inline SVG to draw the circle at the center -->
      <svg id="circle-icon" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="lineGradientCircle">
            <stop offset="0%" stop-color="darkred" />
            <stop offset="50%" stop-color="red" />
            <stop offset="100%" stop-color="darkred" />
          </linearGradient>
        </defs>
        <!-- The circle is drawn from a full stroke-dashoffset down to 0 -->
        <circle
          class="draw-circle"
          cx="50"
          cy="50"
          r="40"
          fill="none"
          stroke="url(#lineGradientCircle)"
          stroke-width="3"
          stroke-dasharray="251"
          stroke-dashoffset="251"
        />
      </svg>
    </div>

    <!-- Flash overlay: covers the screen to produce a flash effect -->
    <div id="flash"></div>

    <!-- Mapbox GL JS library -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
    <!-- Custom script -->
    <script src="script.js"></script>
  </body>
</html>
