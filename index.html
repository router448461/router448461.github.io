<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Full-Screen Map with Animated SF Scope</title>
    <!-- External stylesheet -->
    <link rel="stylesheet" href="style.css" />
    <!-- Mapbox GL JS stylesheet -->
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Map container -->
    <div id="map"></div>

    <!-- Overlay container with animated red lines and the scope icon -->
    <div id="overlay">
      <!-- Animated red lines -->
      <div class="line horizontal left"></div>
      <div class="line horizontal right"></div>
      <div class="line vertical top"></div>
      <div class="line vertical bottom"></div>

      <!-- Inline SVG for the SF Scope symbol -->
      <svg id="scope-icon" viewBox="0 0 100 100">
        <defs>
          <!-- Define a gradient that matches the red lines -->
          <linearGradient id="lineGradient" gradientTransform="rotate(90)">
            <stop offset="0%" stop-color="darkred" />
            <stop offset="50%" stop-color="red" />
            <stop offset="100%" stop-color="darkred" />
          </linearGradient>
        </defs>
        <!-- A circle that will be “drawn” using stroke-dasharray techniques -->
        <circle
          class="scope-circle"
          cx="50"
          cy="50"
          r="40"
          fill="none"
          stroke="url(#lineGradient)"
          stroke-width="3"
          stroke-dasharray="251"
          stroke-dashoffset="251"
        />
        <!-- Vertical crosshair line -->
        <line
          class="scope-line"
          x1="50"
          y1="10"
          x2="50"
          y2="90"
          stroke="url(#lineGradient)"
          stroke-width="3"
          stroke-dasharray="80"
          stroke-dashoffset="80"
        />
        <!-- Horizontal crosshair line -->
        <line
          class="scope-line"
          x1="10"
          y1="50"
          x2="90"
          y2="50"
          stroke="url(#lineGradient)"
          stroke-width="3"
          stroke-dasharray="80"
          stroke-dashoffset="80"
        />
      </svg>
    </div>

    <!-- Mapbox GL JS library -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
    <!-- Custom script for map initialization -->
    <script src="script.js"></script>
  </body>
</html>
