<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Constellation — Tactical (Flight Overlay)</title>

  <!-- Boot visuals -->
  <link rel="stylesheet" href="assets/css/loader.css" />

  <!-- Inline polyfill for window.styleMedia to avoid deprecation noise -->
  <script>
    (function () {
      if (!window.styleMedia) {
        try {
          window.styleMedia = {
            matchMedium(q) {
              try { return !!window.matchMedia && window.matchMedia(q).matches; } catch (e) { return false; }
            }
          };
        } catch (e) {}
      }
    })();
  </script>

  <!-- main.css is injected by engine.init.js -->
  <script src="assets/js/engine.init.js" defer></script>
</head>
<body>
  <div id="loader" aria-hidden="true">
    <div class="loader-wrap" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <div class="blink">Initializing Tactical Feed...</div>
    </div>
  </div>

  <!-- Map container (Leaflet / MapKit can render here). Sits under the transparent canvas. -->
  <div id="mapContainer" aria-hidden="true"></div>

  <!-- Tactical canvas sits above the map -->
  <canvas id="constellationCanvas" aria-hidden="false"></canvas>
</body>
</html>
