<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <!-- Clickjacking protection -->
  <meta http-equiv="X-Frame-Options" content="DENY">

  <!-- MIME sniffing protection -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">

  <!-- Don’t send Referer header -->
  <meta name="referrer" content="no-referrer">

  <!-- Disable browser features you don’t need -->
  <meta http-equiv="Permissions-Policy"
        content="geolocation=(); camera=(); microphone=(); interest-cohort=()">

  <!-- Strict Content Security Policy -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'none';">

  <title>Strobe World Map</title>

  <!-- Preload map for faster first paint -->
  <link rel="preload" href="world-map.png" as="image">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <img id="map-black" src="world-map.png" alt="">
  <img id="map-white" src="world-map.png" alt="">
  <div id="strobe-text">FLASHING TEXT</div>
</body>
</html>
