<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Danger Map</title>

    <!-- Mapbox GL JS stylesheet -->
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css"
      rel="stylesheet"
    />
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Map container -->
    <div id="map"></div>

    <!-- Overlay container for animated red lines -->
    <div id="overlay">
      <!-- Cross Lines (Horizontal & Vertical) -->
      <div class="line horizontal left"></div>
      <div class="line horizontal right"></div>
      <div class="line vertical top"></div>
      <div class="line vertical bottom"></div>
      
      <!-- Triangle Lines – these three divs use the same style as the other lines -->
      <!-- Vertex positions (in viewport percentages):
           • Top left vertex: left edge (25%) & vertical position 65%
           • Top right vertex: right edge (75%) & vertical position 65%
           • Bottom (apex) vertex: center (50%) & vertical position 30%
           The horizontal (base) line spans between the left and right vertices,
           and the other two diagonal lines connect each top vertex to the bottom vertex. -->
      <div class="line triangle ab"></div>
      <div class="line triangle ac"></div>
      <div class="line triangle bc"></div>
    </div>

    <!-- Info container for status message and clock (positioned top-right) -->
    <div id="info">
      <div id="status">ESTABLISHING VIDEO UPLINK...</div>
      <div id="clock" style="display: none;"></div>
    </div>

    <!-- Flash overlay for full-screen flash effect -->
    <div id="flash-overlay"></div>

    <!-- Mapbox GL JS library -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
    <!-- Link to external JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
