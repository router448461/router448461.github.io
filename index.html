<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="router448461.com :: world sonar" />
    <title>router448461.com :: world sonar</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="title">router448461.com</div>
        <div class="subtitle">world sonar</div>
      </div>

      <div class="status">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">initializing</span>
      </div>

      <div class="clocks">
        <div><span>local</span><strong id="local-time">--</strong></div>
        <div><span>utc</span><strong id="utc-time">--</strong></div>
      </div>
    </header>

    <main class="layout">
      <section class="map-panel">
        <canvas id="world-canvas"></canvas>
      </section>

      <aside class="info-panel">
        <div class="info-head">
          <h2>viewer</h2>
          <span id="source-tag">no fix</span>
        </div>
        <div class="rows" id="info-rows"></div>
      </aside>
    </main>
  </body>
</html>
