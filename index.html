<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Constellation Start Page</title>
  <meta name="description" content="An immersive constellation start page by router448461. Click ⏚ to enter." />
  <meta property="og:title" content="Constellation Start Page" />
  <meta property="og:description" content="An immersive constellation start page by router448461. Click ⏚ to enter." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://router448461.com/" />
  <meta property="og:image" content="favicon.ico" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="assets/css/loader.css" />
  <!-- main.css is preloaded and applied by engine.init.js -->
  <script src="assets/js/engine.init.js" defer></script>
</head>
<body>
  <main>
    <!-- ⏚ Entry symbol, visually behind the constellation canvas, but clickable and accessible -->
    <button id="centerEnter" class="center-enter" aria-label="Enter site" tabindex="0">
      <span class="center-symbol" aria-hidden="true">⏚</span>
    </button>
    <canvas id="constellationCanvas" aria-label="constellation interactive animation" tabindex="0"></canvas>
  </main>
  <noscript>
    <style>
      #constellationCanvas { display: block !important; }
      .center-enter { display: none !important; }
    </style>
    <div style="color: #c9d1d9; background: #0b0f16; text-align: center; padding: 2em;">
      JavaScript is required for the interactive start page.
    </div>
  </noscript>
</body>
</html>
