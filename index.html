<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>router448461 // net-scan v2.1</title>
  <meta name="description" content="lower-case operator-style visitor network telemetry terminal." />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="wrap">
    <div class="line head">router448461.com :: operator console</div>
    <div class="line">status: <span id="status">booting</span></div>
    <div class="line">mode: <span id="modeLabel">operator</span> :: filter: <span id="filterLabel">compact</span></div>
    <div class="line">$ ./net-scan --edge --client --display --dns --runtime</div>

    <pre id="summary" aria-live="polite"></pre>
    <pre id="events"></pre>
    <pre id="terminal"></pre>

    <div class="controls">
      <button id="viewToggle" type="button">switch to raw view</button>
      <button id="filterToggle" type="button">show all fields</button>
    </div>

    <div class="line tail">$ <span class="cursor">█</span></div>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
