<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Danger Map</title>
    
    <!-- Mapbox GL JS stylesheet -->
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css"
      rel="stylesheet"
    />
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Map container -->
    <div id="map"></div>

    <!-- Overlay container for animated red lines -->
    <div id="overlay">
      <!-- Cross Lines (Horizontal & Vertical) -->
      <div class="line horizontal left"></div>
      <div class="line horizontal right"></div>
      <div class="line vertical top"></div>
      <div class="line vertical bottom"></div>
      
      <!-- Triangle Lines forming the Predator reticle -->
      <!-- These are fixed so that their endpoints come from:  
             • the top left,  
             • the top right, and  
             • the middle of the bottom  
           They are styled exactly like the other lines and connect as follows:
           - The horizontal triangle line (.triangle.ab) spans from 25% to 75% horizontally at 35% vertical.
           - The left diagonal (.triangle.ac) starts at (25%,35%) and, using a rotate(55deg) transform, extends downward.
           - The right diagonal (.triangle.bc) starts at (75%,35%) and, with rotate(-55deg), extends downward.
           Together these three lines form an inverted triangle (pointing downward) surrounding the center. -->
      <div class="line triangle ab"></div>
      <div class="line triangle ac"></div>
      <div class="line triangle bc"></div>
    </div>

    <!-- Info container for status message and clock -->
    <div id="info">
      <div id="status">ESTABLISHING VIDEO UPLINK...</div>
      <div id="clock" style="display: none;"></div>
    </div>

    <!-- Flash overlay for full–screen flash effect -->
    <div id="flash-overlay"></div>

    <!-- Mapbox GL JS library -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
    <!-- Link to external JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
