<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <!-- security meta tags omitted for brevity -->

  <title>Black & White Strobe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <img id="map-black" src="world-map.png" alt="World map">
  <img id="map-white" src="world-map.png" alt="">

  <div id="strobe-text">
    <span class="word word-black">BLACK</span>
    <span class="word word-amp">&amp;</span>
    <span class="word word-white">WHITE</span>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker
               .register('/script.js', { scope: '/' })
               .catch(console.error);
    }
  </script>
</body>
</html>
