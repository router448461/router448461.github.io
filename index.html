<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" 
          content="width=device-width, initial-scale=1.0" />
    <title>Uluru & Australian Bases – Sinister Map</title>
    <!-- Link to CSS -->
    <link rel="stylesheet" href="style.css" />
    <!-- Mapbox GL JS stylesheet -->
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Map container -->
    <div id="map"></div>

    <!-- Timers container in top-right -->
    <div id="timers">
      <div id="clock"></div>
      <div id="countdown"></div>
    </div>

    <!-- (No full-screen overlay now –
         the red lines are drawn in a custom marker over Uluru) -->

    <!-- Mapbox GL JS library -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
    <!-- Link to JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
