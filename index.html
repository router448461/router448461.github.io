<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>World on Fire</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Full-screen scene: fire + map -->
  <div id="scene"></div>

  <!-- Ember particle canvas -->
  <canvas id="embers"></canvas>

  <!-- Scrolling quote on top -->
  <div id="ticker">
    <span class="message">
      The sun rises, sets in a day, but my love for you always remains.
      You've had enough chances now; it's time. Now, at least, go and say goodbye.
    </span>
  </div>

  <!-- Click “burn ripple” -->
  <div id="ripple"></div>

  <script src="script.js"></script>
</body>
</html>
