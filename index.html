<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target System on World Map</title>
    <meta name="description" content="Interactive world map with dynamic crosshairs and blinking capital city markers.">
    <meta name="keywords" content="world map, interactive map, dynamic crosshairs, city markers">
    <meta name="author" content="Your Name">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <main role="application" aria-labelledby="map-title">
        <h1 id="map-title">World Map Display with Target System</h1>
        <section id="map-section">
            <div id="map-container">
                <div id="vertical-line" aria-label="Vertical crosshair line" aria-hidden="true"></div>
                <div id="horizontal-line" aria-label="Horizontal crosshair line" aria-hidden="true"></div>
            </div>
            <div id="coordinates-panel" aria-live="polite" role="status">Coordinates: None</div>
            <div id="time-panel" aria-live="polite" role="status">Time: Loading...</div>
            <div id="day-night-panel" aria-live="polite" role="status">Mode: Day</div>
        </section>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
