<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>router448461</title>
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Quantico&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Boot overlay removed -->
    <div id="glitch-overlay"></div>
    <div id="map"></div>
    <div id="depth-overlay"></div>
    <div id="overlay">
      <div class="line horizontal left"></div>
      <div class="line horizontal right"></div>
      <div class="line vertical top"></div>
      <div class="line vertical bottom"></div>
    </div>
    <div id="scanlines"></div>
    <div id="noise"></div>
    <div id="laser-scan-horizontal"></div>
    <div id="laser-scan-vertical"></div>
    <div id="hud" role="status" aria-live="polite">
      <div id="timer">00:00:00:00</div>
    </div>
    <div id="coords"></div>
    <div id="reticle"></div>
    
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
