name: Publish site to IPFS

on:
  workflow_dispatch:
  push:
    branches:
      - router448461.com
    paths-ignore:
      - '.ipfs-history/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Stage website files
        run: |
          rm -rf ipfs-site
          mkdir -p ipfs-site/qr
          cp index.html style.css background.js copy.js icon.svg og-image.svg 404.html 404.css _headers ipfs-site/
          cp qr/* ipfs-site/qr/

      - name: Build release manifest
        run: |
          set -euo pipefail
          mkdir -p ipfs-release
          find ipfs-site -type f -print0 | sort -z | while IFS= read -r -d '' file; do
            relative="${file#ipfs-site/}"
            sha256sum "$file" | awk -v p="$relative" '{print p"  "$1}'
          done > ipfs-release/SHA256SUMS

          hashes_json="$(jq -R -s 'split("\n") | map(select(length > 0))' ipfs-release/SHA256SUMS)"
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson hashes "$hashes_json" \
            '{commit:$commit, generated_utc:$generated, files:$hashes}' \
            > ipfs-release/manifest.json

          echo "Release manifest created:"
          cat ipfs-release/manifest.json

      - name: Install current Pinata SDK
        run: npm install --no-save pinata

      - name: Upload website folder to public IPFS via Pinata
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          set -euo pipefail
          test -n "$PINATA_JWT" || { echo "PINATA_JWT secret is missing"; exit 1; }

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { PinataSDK } = require('pinata');

          const root = path.resolve('ipfs-site');
          const files = [];

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else files.push(full);
            }
          }

          walk(root);

          const mime = (file) => {
            const ext = path.extname(file).toLowerCase();
            return ({
              '.html': 'text/html',
              '.css': 'text/css',
              '.js': 'application/javascript',
              '.svg': 'image/svg+xml',
              '.png': 'image/png'
            })[ext] || 'application/octet-stream';
          };

          (async () => {
            const pinata = new PinataSDK({
              pinataJwt: process.env.PINATA_JWT
            });

            const uploadFiles = files.map((full) => {
              const relative = path.relative(root, full).split(path.sep).join('/');
              return new File([fs.readFileSync(full)], relative, { type: mime(full) });
            });

            console.log(`Uploading ${uploadFiles.length} files as one public IPFS directory...`);
            const result = await pinata.upload.public.fileArray(uploadFiles).name(`router448461-${process.env.GITHUB_SHA}`);
            const cid = result?.cid;
            if (!cid) throw new Error(`Pinata returned no CID: ${JSON.stringify(result)}`);

            console.log(`IPFS CID: ${cid}`);
            fs.writeFileSync('ipfs-result.json', JSON.stringify({ cid, commit: process.env.GITHUB_SHA }, null, 2));
          })().catch((error) => {
            console.error(error?.stack || error);
            process.exit(1);
          });
          NODE

      - name: Verify IPFS publication
        run: |
          set -euo pipefail
          cid="$(jq -r '.cid' ipfs-result.json)"
          test -n "$cid" && test "$cid" != "null"

          echo "Published CID: $cid"
          echo "Checking public IPFS retrieval..."
          curl --silent --show-error --fail --location \
            --retry 3 --retry-delay 2 \
            "https://ipfs.io/ipfs/${cid}/index.html" \
            -o ipfs-index.html

          grep -q "ROUTER 448461" ipfs-index.html
          echo "Verified index.html through a public IPFS gateway."

          for asset in qr/binance.png qr/coinbase.png qr/coinbase-advanced.png qr/crypto-com.png qr/starlink.svg; do
            curl --silent --show-error --fail --location \
              --retry 3 --retry-delay 2 \
              "https://ipfs.io/ipfs/${cid}/${asset}" \
              -o /dev/null
            echo "Verified ${asset}"
          done

      - name: Record IPFS release history
        run: |
          set -euo pipefail
          cid="$(jq -r '.cid' ipfs-result.json)"
          generated="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          release_id="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:12}"

          mkdir -p .ipfs-history/releases

          jq \
            --arg cid "$cid" \
            --arg commit "$GITHUB_SHA" \
            --arg generated "$generated" \
            --arg gateway "https://ipfs.router448461.com/" \
            --slurpfile manifest ipfs-release/manifest.json \
            '{cid:$cid, commit:$commit, generated_utc:$generated, gateway:$gateway, manifest:$manifest[0]}' \
            /dev/null \
            > ".ipfs-history/releases/${release_id}.json"

          cat > .ipfs-history/latest.json <<EOF
          {
            "cid": "$cid",
            "commit": "$GITHUB_SHA",
            "generated_utc": "$generated",
            "gateway": "https://ipfs.router448461.com/"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ipfs-history
          if git diff --cached --quiet; then
            echo "No release-history changes to commit."
          else
            git commit -m "Record IPFS release ${release_id} [skip ipfs]"
            git push origin HEAD:router448461.com
          fi

      - name: Update Cloudflare DNSLink
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "Cloudflare secrets not configured; skipping DNSLink update."
            exit 0
          fi
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN secret is missing"; exit 1; }
          test -n "${CLOUDFLARE_ZONE_ID:-}" || { echo "CLOUDFLARE_ZONE_ID secret is missing"; exit 1; }

          cid="$(jq -r '.cid' ipfs-result.json)"
          echo "Looking up Web3 gateway hostname ipfs.router448461.com..."
          hostnames="$(curl --silent --show-error --fail \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/web3/hostnames" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")"

          identifier="$(printf '%s' "$hostnames" | jq -r '.result[] | select(.name == "ipfs.router448461.com") | .id' | head -n1)"
          test -n "$identifier" || { echo "Could not find Web3 hostname ipfs.router448461.com"; exit 1; }

          response="$(curl --silent --show-error --fail \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/web3/hostnames/${identifier}" \
            -X PATCH \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg dnslink "/ipfs/${cid}" '{dnslink:$dnslink}')")"

          printf '%s\n' "$response" | jq '{success, result: {name: .result.name, target: .result.target, dnslink: .result.dnslink, status: .result.status}}'
          test "$(printf '%s' "$response" | jq -r '.success')" = "true" || { echo "Cloudflare DNSLink update failed"; exit 1; }
          echo "Cloudflare DNSLink updated to /ipfs/${cid}"
