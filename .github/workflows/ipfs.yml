name: Publish site to IPFS

on:
  workflow_dispatch:
  push:
    branches:
      - router448461.com

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage website files
        run: |
          rm -rf ipfs-site
          mkdir -p ipfs-site/qr
          cp index.html style.css background.js copy.js icon.svg og-image.svg 404.html 404.css _headers ipfs-site/
          cp qr/* ipfs-site/qr/

      - name: Upload website folder to Pinata
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          set -euo pipefail
          test -n "$PINATA_JWT" || { echo "PINATA_JWT secret is missing"; exit 1; }
          args=(--request POST --url https://api.pinata.cloud/pinning/pinFileToIPFS --header "Authorization: Bearer $PINATA_JWT" --form 'pinataMetadata={"name":"router448461-'"$GITHUB_SHA"'"}' --form 'pinataOptions={"cidVersion":1}' --write-out '\nHTTP_STATUS:%{http_code}\n' --output pinata-response.json)
          while IFS= read -r -d '' file; do
            relative="${file#ipfs-site/}"
            args+=(--form "file=@${file};filename=${relative}")
          done < <(find ipfs-site -type f -print0 | sort -z)
          http_output="$(curl --silent --show-error "${args[@]}" 2>&1)"
          curl_exit=$?
          printf '%s\n' "$http_output"
          echo "Pinata response body:"
          cat pinata-response.json || true
          test "$curl_exit" -eq 0 || { echo "Pinata upload request failed at curl level (exit $curl_exit)"; exit "$curl_exit"; }
          http_status="$(printf '%s\n' "$http_output" | sed -n 's/^HTTP_STATUS://p' | tail -n1)"
          case "$http_status" in 2*) ;; *) echo "Pinata HTTP error: $http_status"; exit 1 ;; esac
          cid="$(jq -r '.IpfsHash // empty' pinata-response.json 2>/dev/null || true)"
          test -n "$cid" || { echo "Pinata response did not contain IpfsHash"; exit 1; }
          echo "IPFS_CID=$cid" >> "$GITHUB_ENV"
          echo "IPFS CID: $cid"
          echo "Gateway URL: https://ipfs.router448461.com/ipfs/$cid/"

      - name: Verify CID metadata
        run: |
          echo "Published commit: $GITHUB_SHA"
          echo "IPFS CID: $IPFS_CID"
          echo "Gateway URL: https://ipfs.router448461.com/ipfs/$IPFS_CID/"
