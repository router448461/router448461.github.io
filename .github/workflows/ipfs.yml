name: Publish site to IPFS

on:
  workflow_dispatch:
  push:
    branches:
      - router448461.com
    paths-ignore:
      - '.ipfs-history/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and stage website
        run: |
          set -euo pipefail
          rm -rf ipfs-site
          mkdir -p ipfs-site

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const stage = path.join(root, 'ipfs-site');
          const refs = new Set(['index.html', '404.html', '404.css', '_headers', '_redirects']);

          function addRef(value) {
            if (!value) return;
            let ref = value.trim().replace(/^\.\//, '').split('?')[0].split('#')[0];
            if (!ref || ref.startsWith('/') || /^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(ref)) return;
            refs.add(ref);
          }

          const html = fs.readFileSync(path.join(root, 'index.html'), 'utf8');
          for (const match of html.matchAll(/(?:src|href)=["']([^"']+)["']/gi)) addRef(match[1]);

          for (const ref of [...refs]) {
            if (!ref.toLowerCase().endsWith('.css')) continue;
            const cssPath = path.join(root, ref);
            if (!fs.existsSync(cssPath)) throw new Error(`Missing referenced CSS: ${ref}`);
            const css = fs.readFileSync(cssPath, 'utf8');
            for (const match of css.matchAll(/url\(\s*["']?([^"')]+)["']?\s*\)/gi)) addRef(match[1]);
          }

          for (const rel of refs) {
            const source = path.join(root, rel);
            if (!fs.existsSync(source) || !fs.statSync(source).isFile()) {
              throw new Error(`Missing referenced site asset: ${rel}`);
            }
            const dest = path.join(stage, rel);
            fs.mkdirSync(path.dirname(dest), { recursive: true });
            fs.copyFileSync(source, dest);
          }

          const qr = path.join(root, 'qr');
          if (fs.existsSync(qr)) fs.cpSync(qr, path.join(stage, 'qr'), { recursive: true });

          const count = fs.readdirSync(stage, { recursive: true }).filter((p) => fs.statSync(path.join(stage, p)).isFile()).length;
          console.log(`Validated and staged ${count} files.`);
          NODE

      - name: Build release manifest
        run: |
          set -euo pipefail
          mkdir -p ipfs-release
          find ipfs-site -type f -print0 | sort -z | while IFS= read -r -d '' file; do
            relative="${file#ipfs-site/}"
            sha256sum "$file" | awk -v p="$relative" '{print p"  "$1}'
          done > ipfs-release/SHA256SUMS

          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson hashes "$(jq -R -s 'split("\n") | map(select(length > 0))' ipfs-release/SHA256SUMS)" \
            '{commit:$commit, generated_utc:$generated, files:$hashes}' \
            > ipfs-release/manifest.json

      - name: Upload folder to Pinata public IPFS
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          set -euo pipefail
          test -n "$PINATA_JWT" || { echo "PINATA_JWT secret is missing"; exit 1; }

          form=(
            -F "pinataMetadata={\"name\":\"router448461-${GITHUB_SHA}\"}"
            -F 'pinataOptions={"cidVersion":1,"wrapWithDirectory":true}'
          )

          while IFS= read -r file; do
            relative="${file#ipfs-site/}"
            form+=( -F "file=@${file};filename=${relative}" )
          done < <(find ipfs-site -type f | sort)

          response="$(curl --silent --show-error --fail --location \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --connect-timeout 15 --max-time 180 \
            -X POST 'https://api.pinata.cloud/pinning/pinFileToIPFS' \
            -H "Authorization: Bearer ${PINATA_JWT}" \
            "${form[@]}")"

          printf '%s\n' "$response" | jq .
          cid="$(printf '%s' "$response" | jq -r '.IpfsHash // empty')"
          test -n "$cid" || { echo "Pinata returned no IpfsHash."; exit 1; }

          printf '%s\n' "$cid" > ipfs-cid.txt
          echo "Published CID: $cid"

      - name: Verify IPFS publication
        run: |
          set -euo pipefail
          cid="$(cat ipfs-cid.txt)"
          gateways=("https://ipfs.io" "https://ipfs.router448461.com")
          active=""

          for gateway in "${gateways[@]}"; do
            echo "Testing ${gateway}..."
            if curl --silent --show-error --fail --location \
              --retry 5 --retry-all-errors --retry-delay 3 \
              --connect-timeout 10 --max-time 45 \
              "${gateway}/ipfs/${cid}/index.html" -o ipfs-index.html && \
              grep -q "ROUTER 448461" ipfs-index.html; then
              active="$gateway"
              echo "Verified publication through ${active}"
              break
            fi
          done

          test -n "$active" || { echo "No public gateway served the new CID."; exit 1; }

          while IFS= read -r asset; do
            curl --silent --show-error --fail --location \
              --retry 5 --retry-all-errors --retry-delay 3 \
              --connect-timeout 10 --max-time 45 \
              "${active}/ipfs/${cid}/${asset}" -o /dev/null
          done < <(find ipfs-site -type f -printf '%P\n' | sort)

          echo "Verified all staged assets through ${active}."

      - name: Record IPFS release history
        run: |
          set -euo pipefail
          cid="$(cat ipfs-cid.txt)"
          generated="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          release_id="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:12}"
          mkdir -p .ipfs-history/releases

          jq -n \
            --arg cid "$cid" \
            --arg commit "$GITHUB_SHA" \
            --arg generated "$generated" \
            --arg gateway "https://ipfs.router448461.com/" \
            --slurpfile manifest ipfs-release/manifest.json \
            '{cid:$cid, commit:$commit, generated_utc:$generated, gateway:$gateway, manifest:$manifest[0]}' \
            > ".ipfs-history/releases/${release_id}.json"

          jq -n \
            --arg cid "$cid" \
            --arg commit "$GITHUB_SHA" \
            --arg generated "$generated" \
            '{cid:$cid, commit:$commit, generated_utc:$generated, gateway:"https://ipfs.router448461.com/"}' \
            > .ipfs-history/latest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ipfs-history
          git commit -m "Record IPFS release ${release_id} [skip ipfs]" || true
          git push origin HEAD:router448461.com || true

      - name: Update Cloudflare DNSLink
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "Cloudflare secrets not configured; skipping DNSLink update."
            exit 0
          fi

          cid="$(cat ipfs-cid.txt)"
          hostnames="$(curl --silent --show-error --fail \
            --retry 3 --retry-all-errors --retry-delay 2 \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/web3/hostnames" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json')"

          identifier="$(printf '%s' "$hostnames" | jq -r '.result[] | select(.name == "ipfs.router448461.com") | .id' | head -n1)"
          test -n "$identifier" || { echo "Cloudflare Web3 hostname ipfs.router448461.com not found."; exit 1; }

          curl --silent --show-error --fail \
            -X PATCH \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/web3/hostnames/${identifier}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg dnslink "/ipfs/${cid}" '{dnslink:$dnslink}')" | jq .
