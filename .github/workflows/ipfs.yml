name: Publish site to IPFS

on:
  workflow_dispatch:
  push:
    branches:
      - router448461.com

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage website files
        run: |
          rm -rf ipfs-site
          mkdir -p ipfs-site/qr
          cp index.html style.css background.js copy.js icon.svg og-image.svg 404.html 404.css _headers ipfs-site/
          cp qr/* ipfs-site/qr/

      - name: Install current Pinata SDK
        run: npm install --no-save pinata

      - name: Upload website folder to public IPFS via Pinata
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          set -euo pipefail
          test -n "$PINATA_JWT" || { echo "PINATA_JWT secret is missing"; exit 1; }

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { PinataSDK } = require('pinata');

          const root = path.resolve('ipfs-site');
          const files = [];

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else files.push(full);
            }
          }

          walk(root);

          const mime = (file) => {
            const ext = path.extname(file).toLowerCase();
            return ({
              '.html': 'text/html',
              '.css': 'text/css',
              '.js': 'application/javascript',
              '.svg': 'image/svg+xml',
              '.png': 'image/png'
            })[ext] || 'application/octet-stream';
          };

          (async () => {
            const pinata = new PinataSDK({
              pinataJwt: process.env.PINATA_JWT
            });

            const uploadFiles = files.map((full) => {
              const relative = path.relative(root, full).split(path.sep).join('/');
              return new File([fs.readFileSync(full)], relative, { type: mime(full) });
            });

            console.log(`Uploading ${uploadFiles.length} files as one public IPFS directory...`);
            const result = await pinata.upload.public.fileArray(uploadFiles).name(`router448461-${process.env.GITHUB_SHA}`);
            const cid = result?.cid;
            if (!cid) throw new Error(`Pinata returned no CID: ${JSON.stringify(result)}`);

            console.log(`IPFS CID: ${cid}`);
            console.log(`Gateway URL: https://ipfs.router448461.com/`);
            fs.writeFileSync('ipfs-result.json', JSON.stringify({ cid, commit: process.env.GITHUB_SHA }, null, 2));
          })().catch((error) => {
            console.error(error?.stack || error);
            process.exit(1);
          });
          NODE

      - name: Verify CID metadata
        run: |
          jq -e '.cid | strings | length > 0' ipfs-result.json >/dev/null
          echo "Published commit: $GITHUB_SHA"
          echo "IPFS CID: $(jq -r '.cid' ipfs-result.json)"
          echo "Gateway URL: https://ipfs.router448461.com/"
