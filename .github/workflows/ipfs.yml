name: Publish site to IPFS

on:
  workflow_dispatch:
  push:
    branches:
      - router448461.com
    paths-ignore:
      - '.ipfs-history/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate and stage website files
        run: |
          set -euo pipefail
          rm -rf ipfs-site
          mkdir -p ipfs-site

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const repoRoot = process.cwd();
          const stageRoot = path.join(repoRoot, 'ipfs-site');
          const publicRootFiles = ['index.html', '404.html', '404.css', '_headers', '_redirects'];
          const refs = new Set();

          function addRef(value) {
            if (!value) return;
            let ref = value.trim();
            if (!ref || ref.startsWith('#')) return;
            if (/^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(ref)) return;
            ref = ref.split('#')[0].split('?')[0];
            ref = ref.replace(/^\.\//, '');
            if (ref.startsWith('/')) ref = ref.slice(1);
            if (ref) refs.add(ref);
          }

          const html = fs.readFileSync(path.join(repoRoot, 'index.html'), 'utf8');
          for (const match of html.matchAll(/(?:src|href)=["']([^"']+)["']/gi)) addRef(match[1]);
          for (const match of html.matchAll(/(?:src|href)=([^\s>]+)/gi)) addRef(match[1]);

          const cssFiles = [...refs].filter((ref) => ref.toLowerCase().endsWith('.css'));
          for (const cssRef of cssFiles) {
            const cssPath = path.join(repoRoot, cssRef);
            if (!fs.existsSync(cssPath)) throw new Error(`Referenced CSS file is missing: ${cssRef}`);
            const css = fs.readFileSync(cssPath, 'utf8');
            for (const match of css.matchAll(/url\(\s*["']?([^"')]+)["']?\s*\)/gi)) addRef(match[1]);
          }

          const required = new Set([...publicRootFiles, ...refs]);
          required.delete('');

          for (const rel of required) {
            const full = path.join(repoRoot, rel);
            if (!fs.existsSync(full) || !fs.statSync(full).isFile()) {
              throw new Error(`Referenced website asset is missing: ${rel}`);
            }
            const dest = path.join(stageRoot, rel);
            fs.mkdirSync(path.dirname(dest), { recursive: true });
            fs.copyFileSync(full, dest);
          }

          const qrDir = path.join(repoRoot, 'qr');
          if (fs.existsSync(qrDir)) {
            fs.cpSync(qrDir, path.join(stageRoot, 'qr'), { recursive: true });
          }

          console.log(`Validated and staged ${required.size} website files plus QR assets.`);
          console.log([...required].sort().join('\n'));
          NODE

      - name: Build release manifest
        run: |
          set -euo pipefail
          mkdir -p ipfs-release
          find ipfs-site -type f -print0 | sort -z | while IFS= read -r -d '' file; do
            relative="${file#ipfs-site/}"
            sha256sum "$file" | awk -v p="$relative" '{print p"  "$1}'
          done > ipfs-release/SHA256SUMS

          hashes_json="$(jq -R -s 'split("\n") | map(select(length > 0))' ipfs-release/SHA256SUMS)"
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson hashes "$hashes_json" \
            '{commit:$commit, generated_utc:$generated, files:$hashes}' \
            > ipfs-release/manifest.json

      - name: Install current Pinata SDK
        run: npm install --no-save pinata@latest

      - name: Upload website folder to public IPFS via Pinata
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          set -euo pipefail
          test -n "$PINATA_JWT" || { echo "PINATA_JWT secret is missing"; exit 1; }

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { PinataSDK } = require('pinata');

          const root = path.resolve('ipfs-site');
          const files = [];

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else files.push(full);
            }
          }

          walk(root);

          const mime = (file) => {
            const ext = path.extname(file).toLowerCase();
            return ({
              '.html': 'text/html',
              '.css': 'text/css',
              '.js': 'application/javascript',
              '.svg': 'image/svg+xml',
              '.png': 'image/png',
              '.jpg': 'image/jpeg',
              '.jpeg': 'image/jpeg',
              '.webp': 'image/webp',
              '.woff': 'font/woff',
              '.woff2': 'font/woff2',
              '.ttf': 'font/ttf',
              '.otf': 'font/otf'
            })[ext] || 'application/octet-stream';
          };

          (async () => {
            const pinata = new PinataSDK({ pinataJwt: process.env.PINATA_JWT });
            const uploadFiles = files.map((full) => {
              const relative = path.relative(root, full).split(path.sep).join('/');
              return new File([fs.readFileSync(full)], relative, { type: mime(full) });
            });

            console.log(`Uploading ${uploadFiles.length} files as one public IPFS directory...`);
            const result = await pinata.upload.public.fileArray(uploadFiles)
              .name(`router448461-${process.env.GITHUB_SHA}`)
              .execute();

            const cid = result?.cid;
            if (!cid) throw new Error(`Pinata returned no CID: ${JSON.stringify(result)}`);

            console.log(`IPFS CID: ${cid}`);
            fs.writeFileSync('ipfs-result.json', JSON.stringify({ cid, commit: process.env.GITHUB_SHA }, null, 2));
          })().catch((error) => {
            console.error(error?.stack || error);
            process.exit(1);
          });
          NODE

      - name: Verify IPFS publication
        run: |
          set -euo pipefail
          cid="$(jq -r '.cid' ipfs-result.json)"
          test -n "$cid" && test "$cid" != "null"

          gateways=("https://ipfs.io" "https://ipfs.router448461.com")
          active=""
          for gateway in "${gateways[@]}"; do
            echo "Testing ${gateway}..."
            if curl --silent --show-error --fail --location \
              --retry 5 --retry-all-errors --retry-delay 3 \
              --connect-timeout 10 --max-time 30 \
              "${gateway}/ipfs/${cid}/index.html" -o ipfs-index.html && \
              grep -q "ROUTER 448461" ipfs-index.html; then
              active="$gateway"
              echo "Verified IPFS publication through ${active}"
              break
            fi
          done

          test -n "$active" || { echo "No public IPFS gateway served the new CID."; exit 1; }

          while IFS= read -r asset; do
            case "$asset" in
              index.html|404.html|_headers|_redirects) continue ;;
            esac
            curl --silent --show-error --fail --location \
              --retry 5 --retry-all-errors --retry-delay 3 \
              --connect-timeout 10 --max-time 30 \
              "${active}/ipfs/${cid}/${asset}" -o /dev/null
            echo "Verified ${asset}"
          done < <(find ipfs-site -type f -printf '%P\n' | sort)

      - name: Record IPFS release history
        run: |
          set -euo pipefail
          cid="$(jq -r '.cid' ipfs-result.json)"
          generated="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          release_id="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:12}"

          mkdir -p .ipfs-history/releases

          jq -n \
            --arg cid "$cid" \
            --arg commit "$GITHUB_SHA" \
            --arg generated "$generated" \
            --arg gateway "https://ipfs.router448461.com/" \
            --slurpfile manifest ipfs-release/manifest.json \
            '{cid:$cid, commit:$commit, generated_utc:$generated, gateway:$gateway, manifest:$manifest[0]}' \
            > ".ipfs-history/releases/${release_id}.json"

          cat > .ipfs-history/latest.json <<EOF
          {
            "cid": "$cid",
            "commit": "$GITHUB_SHA",
            "generated_utc": "$generated",
            "gateway": "https://ipfs.router448461.com/"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ipfs-history
          if git diff --cached --quiet; then
            echo "No release-history changes to commit."
          else
            git commit -m "Record IPFS release ${release_id} [skip ipfs]"
            git push origin HEAD:router448461.com
          fi

      - name: Update Cloudflare DNSLink
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "Cloudflare secrets not configured; skipping DNSLink update."
            exit 0
          fi
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN secret is missing"; exit 1; }
          test -n "${CLOUDFLARE_ZONE_ID:-}" || { echo "CLOUDFLARE_ZONE_ID secret is missing"; exit 1; }

          cid="$(jq -r '.cid' ipfs-result.json)"
          hostnames="$(curl --silent --show-error --fail \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/web3/hostnames" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")"

          identifier="$(printf '%s' "$hostnames" | jq -r '.result[] | select(.name == "ipfs.router448461.com") | .id' | head -n1)"
          test -n "$identifier" || { echo "Could not find Web3 hostname ipfs.router448461.com"; exit 1; }

          response="$(curl --silent --show-error --fail \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/web3/hostnames/${identifier}" \
            -X PATCH \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg dnslink "/ipfs/${cid}" '{dnslink:$dnslink}')")"

          printf '%s\n' "$response" | jq '{success, result: {name: .result.name, target: .result.target, dnslink: .result.dnslink, status: .result.status}}'
          test "$(printf '%s' "$response" | jq -r '.success')" = "true" || { echo "Cloudflare DNSLink update failed"; exit 1; }
