name: Publish site to IPFS

on:
  workflow_dispatch:
  push:
    branches:
      - router448461.com

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage website files
        run: |
          rm -rf ipfs-site
          mkdir -p ipfs-site/qr
          cp index.html style.css background.js copy.js icon.svg og-image.svg 404.html 404.css _headers ipfs-site/
          cp qr/* ipfs-site/qr/

      - name: Upload website folder to Pinata
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          set -euo pipefail

          test -n "$PINATA_JWT" || { echo "PINATA_JWT secret is missing"; exit 1; }

          args=(
            --silent
            --show-error
            --fail-with-body
            --request POST
            --url https://api.pinata.cloud/pinning/pinFileToIPFS
            --header "Authorization: Bearer $PINATA_JWT"
            --form 'pinataMetadata={"name":"router448461-'"$GITHUB_SHA"'"}'
            --form 'pinataOptions={"cidVersion":1}'
          )

          while IFS= read -r -d '' file; do
            relative="${file#ipfs-site/}"
            args+=(--form "file=@${file};filename=${relative}")
          done < <(find ipfs-site -type f -print0 | sort -z)

          response="$(curl "${args[@]}")"
          echo "$response" | tee ipfs-upload-response.json

          cid="$(printf '%s' "$response" | jq -r '.IpfsHash // empty')"
          test -n "$cid" || { echo "Pinata did not return an IpfsHash"; exit 1; }

          echo "IPFS_CID=$cid" >> "$GITHUB_ENV"
          echo "IPFS CID: $cid"
          echo "Gateway URL: https://ipfs.router448461.com/ipfs/$cid/"

      - name: Verify CID metadata
        run: |
          echo "Published commit: $GITHUB_SHA"
          echo "IPFS CID: $IPFS_CID"
          echo "Gateway URL: https://ipfs.router448461.com/ipfs/$IPFS_CID/"
